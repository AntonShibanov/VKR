# config.yaml
# КОНФИГУРАЦИОННЫЙ ФАЙЛ ЭКСПЕРИМЕНТА
# Управляет всеми параметрами: генерацией синтетической IoT-нагрузки,
# топологией узлов гибридной БД (симулятор ROW/COL кластеров), сценариями
# деградации оборудования, гиперпараметрами RL-агента и параметрами анализа
# результатов. Загружается скриптами run_experiment.py / power_analysis.py /
# make_plots.py через yaml.safe_load().

workload: # --- Параметры генератора потока запросов (см. src/workload.py) ---
  n_queries: 200000 # общее число запросов в ОДНОМ эпизоде
  # разогрев (burn-in) перед измерением метрик.
  # Первые warmup_queries запросов реально маршрутизируются и (для
  # bandit_lints/rl_dqn) реально обучаются, НО не попадают в итоговые
  # метрики (episode_summary.csv, node_usage.csv, sla_counts.csv) и не
  # сохраняются в trace_*.npy. Это НЕ оракульный тёплый старт (там
  # требовалось клонирование среды — физически невозможно в реальной
  # системе) — это обычная онлайн-работа на РЕАЛЬНОМ потоке запросов,
  # просто до начала окна измерения KPI. Применяется ОДИНАКОВО ко всем
  # методам (а не только к RL) — убирает артефакт холодного старта очередей
  # /кэша/лага репликации для всех стратегий сразу, а не только для DQN.
  # eps_decay_steps в секции dqn ниже совпадает с warmup_queries (50000) —
  # значит, к концу разогрева эпсилон DQN уже близок к eps_base, и
  # измеряемый эпизод (следующие n_queries - warmup_queries = 150000
  # запросов) начинается с уже почти полностью эксплуатационной политики.
  warmup_queries: 50000
  drift_enabled:
    1 # 1 = фазы дрейфа нагрузки применяются по порядку и циклически повторяются;
    # 0 = вся нагрузка идёт только на первой фазе списка (обычно "steady",
    # т.е. без смены режима нагрузки) — используется для "чистых" экспериментов
  phases: # Список периодов (фаз) дрейфа нагрузки. Каждая фаза применяется ровно
    # "length" запросов подряд, затем список циклически повторяется, пока
    # не наберётся n_queries запросов. Можно менять длину/микс/тяжесть
    # КАЖДОЙ фазы независимо — без изменения кода.
    - name: steady # внутренний идентификатор фазы (используется в графиках/логике)
      length: 10000 # сколько запросов подряд действует эта фаза
      mix: # доли типов запроса [insert, analytic, transactional]; сумма = 1.0
        - 0.7 # 70% запросов — вставки телеметрии с датчиков
        - 0.2 # 20% запросов — аналитические (тяжёлые, читающие много данных)
        - 0.1 # 10% запросов — транзакционные (требуют строгой согласованности)
      cost_scale: 1.0 # множитель "стоимости" (объёма/сложности) аналитических запросов в этой фазе
      label_ru: Стабильный режим # человекочитаемое название фазы для подписей на графиках
    - name: insert_burst # фаза "всплеск вставок" — имитирует резкий приток данных с датчиков
      length: 15000 # длина фазы в запросах
      mix:
        - 0.92 # 92% — вставки (доминируют)
        - 0.05 # 5% — аналитика (почти отсутствует)
        - 0.03 # 3% — транзакции
      cost_scale: 1.0 # тяжесть аналитики не меняется в этой фазе
      label_ru: Всплеск вставок
    - name: analytic_saturation # фаза "насыщение аналитикой" — массовый запуск отчётов/мониторинга
      length: 10000
      mix:
        - 0.4 # 40% — вставки
        - 0.55 # 55% — аналитика (доминирует)
        - 0.05 # 5% — транзакции
      cost_scale: 1.0
      label_ru: Насыщение аналитикой
    - name: scale_shift # фаза "рост масштаба данных" — смешанный микс, но аналитика "тяжелее"
      length: 15000
      mix:
        - 0.55 # 55% — вставки
        - 0.3 # 30% — аналитика
        - 0.15 # 15% — транзакции
      cost_scale:
        3.0 # КЛЮЧЕВОЕ отличие фазы: аналитические запросы утроены по объёму/сложности
        # (имитирует рост накопленных данных, а не просто смену микса типов)
      label_ru: Рост масштаба данных
  cost_distributions: # Redset, (март-май 2024).
    # ВАЖНО: mu зафиксированы на старых синтетических значениях ПО ДИЗАЙНУ,
    # из реальных данных переносится ТОЛЬКО форма (sigma), медиана-якорь
    # сохранена, чтобы не менять абсолютный масштаб условных единиц cost.
    # Реально зафитированные mu (в единицах log(mbytes_scanned)) были
    # 4.616/4.619/2.822 соответственно, не используются напрямую.
    insert: { mu: 1.0, sigma: 0.794 } # взято из Redshift DB
    analytic: { mu: 3.5, sigma: 2.296 } # взято из Redshift DB
    transactional: { mu: 1.5, sigma: 0.073 } # взято из Redshift DB

offline: # --- Параметры офлайн-этапа (претрейн RL / обучение GBM до старта эпизода) ---
  n_offline_queries:
    1000 # сколько "исторических" запросов сгенерировать для построения
    # офлайн-логов (build_oracle_log для RL, build_bandit_log для GBM)

nodes: # --- Топология и физические характеристики узлов гибридной БД ---
  n_row_nodes: 6 # число узлов в строчном (OLTP) кластере ROW
  n_col_nodes: 4 # число узлов в колоночном (OLAP) кластере COL
  row_service_rate: 0.3 # пропускная способность одного ROW-узла (единиц очереди, обслуживаемых за шаг)
  col_service_rate: 0.25 # пропускная способность одного COL-узла (ниже — аналитика "тяжелее")
  row_rtt_ms: 0.3 # базовая сетевая задержка (RTT) до ROW-узла, мс
  col_rtt_ms: 2.0 # базовая сетевая задержка до COL-узла, мс (аналитический кластер "дальше")
  load_scales_with_cost:
    1 # 1 = вклад запроса в очередь узла пропорционален его "стоимости"
    # (тяжёлый запрос сильнее нагружает очередь, а не фиксированной величиной);
    # 0 = старое поведение (одинаковый вклад независимо от стоимости запроса)
  # --- ИЗМЕНЕНИЕ: cost_load_reference теперь раздельный по qtype ---
  # "analytic" оставлен РОВНО 16.0 — это задокументированный фикс после
  # калибровки sigma аналитики по Redset (0.6 -> 2.296); трогать нельзя,
  # иначе возвращается проблема избыточного среза потолком очереди
  # (~42.9% запросов вместо целевых ~24.6%).
  # "insert"/"transactional" понижены до собственной медианной стоимости
  # (exp(mu) = 2.718 / 4.482) — восстанавливает реальное давление на
  # очередь COL при массовой отправке туда дешёвых запросов (было:
  # arrival_load << col_service_rate, то есть фактически "бесплатно";
  # стало: arrival_load на медиане == ARRIVAL_LOAD == 0.35 > 0.25).
  # Это НЕ новое число из какого-либо датасета — это инженерное решение
  # (симметричное уже применённому для cost_scaling_reference), которое
  # не противоречит ни одной из калибровок Redset/London/AQD, поскольку
  # ни один из источников не задаёт значение cost_load_reference напрямую.
  cost_load_reference:
    insert: 2.718281828459045
    analytic: 16.0
    transactional: 4.481689070338065
  cost_scaling_exponent: 0.953 # эластичность задержки от cost (см. environment.py::step -> scale_processing)
  # --- ИЗМЕНЕНИЕ (п.2 анализа after-калибровки Redset) ---
  # Новый ключ. Экспонент эластичности СЕТЕВОЙ (не серверной) компоненты
  # задержки от стоимости запроса — ОТДЕЛЬНЫЙ от cost_scaling_exponent.
  # Явно задан = 0.0 (сетевая задержка cost-независима), т.к. источник
  # калибровки cost_scaling_exponent (Redset, регрессия
  # execution_duration_ms ~ mbytes_scanned) описывает только серверное
  # время обработки — переносить его на сетевой RTT физически необоснованно
  # (см. анализ результатов "до/после калибровки": mean_network_ms после
  # калибровки без этого разделения вырастал до 43-325 мс против 2-2.4 мс
  # до калибровки — нереалистичный артефакт).
  network_cost_scaling_exponent: 0.0
  # Примечание: environment.py также поддерживает параметр
  # cost_scaling_reference (словарь {qtype: референсная стоимость} для
  # нормировки cost_scaling_exponent — см. DEFAULT_COST_SCALING_REFERENCE в
  # environment.py). Здесь он намеренно НЕ переопределяется — используются
  # значения по умолчанию (exp(1.0)/exp(3.5)/exp(1.5)), совпадающие с
  # сохранёнными mu из workload.cost_distributions выше.
  admission_control_enabled:
    1 # 1 = включён admission control (backpressure): очередь узла ограничена
    # сверху (см. max_queue_row/col), новые запросы при заполнении либо
    # перенаправляются на другой движок, либо отклоняются с ограниченной
    # задержкой — имитация реальных механизмов (Vitess, OJP, circuit breaker)
  max_queue_row: 10.0 # максимальная длина очереди ROW-узла (единиц очереди)
  max_queue_col: 10.0 # максимальная длина очереди COL-узла
  reject_timeout_ms:
    600.0 # фиксированная (ограниченная) задержка, если запрос ОТКЛОНЁН
    # admission control (нет доступного узла ни в одном кластере)
  admission_reroute_penalty_ms:
    8.0 # штраф к задержке, если admission control ПЕРЕНАПРАВИЛ запрос
    # на другой (не запрошенный политикой) движок
  # Примечание: environment.py также поддерживает параметры arrival_load и
  # max_arrival_load_mult (вынесены из констант класса ARRIVAL_LOAD/
  # MAX_ARRIVAL_LOAD_MULT специально для совместимости с калибровкой выше —
  # см. п. B2 итоговой таблицы). В этой версии конфига они намеренно
  # оставлены на значениях по умолчанию (0.35 и 10.0 соответственно) и
  # поэтому здесь не переопределяются.
  # --- НОВОЕ: вариант 1 интенсификации сценария ---
  # Нелинейная (M/M/1-подобная) задержка очереди вместо линейной. Включение
  # делает приближение очереди к пределу ёмкости (max_queue_row/col=10.0)
  # резко опаснее, чем раньше, усиливая ценность признаков row_q/col_q в
  # state_vector. ВНИМАНИЕ: значения ниже — дизайн-решение для усложнения
  # эксперимента, не измеренная величина; требуют проверки повторным
  # прогоном и, при необходимости, подбора.
  queue_nonlinear_enabled: 1
  queue_rho_cap: 0.95 # верхняя граница rho=queue/capacity (ограничивает рост до rho/(1-rho)=19)
  queue_rho_reference: 10.0 # условная ёмкость, если admission_control выключен (max_queue=inf)

  # --- НОВОЕ: вариант 2 интенсификации сценария ---
  # Случайные ("мерцающие") кратковременные замедления узлов, независимые от
  # запланированных событий в секции degradation ниже. Цель — равномерно
  # по ВСЕМУ эпизоду (а не только в двух окнах из degradation) создавать
  # ситуации, где здоровый по cost-эвристике выбор движка на самом деле
  # не оптимален из-за текущей деградации конкретного узла — сигнал,
  # доступный только state-aware политикам (RL/бандит), но не
  # CostThresholdRouter. Параметры — стартовая точка для экспериментов,
  # не калиброванные по внешним данным величины.
  stochastic_degradation_enabled: 1
  stochastic_degradation_prob: 0.0008 # вероятность начала "мерцания" на узел за шаг
  stochastic_degradation_duration_range: [50, 300] # длительность одного эпизода мерцания, запросов
  stochastic_degradation_health_range: [2.0, 6.0] # диапазон целевого health_factor во время мерцания

degradation: # --- Основной сценарий деградации узла (симуляция сбоя/перегрузки оборудования) ---
  enabled: true # true = сценарий деградации активен; false = деградации нет вовсе
  engine: col # какой кластер деградирует: "row" или "col"
  node_idx: 0 # индекс конкретного узла внутри кластера (col_0, если engine=col)
  start_query: 100000 # номер запроса, с которого начинается нарастание деградации
  end_query: 140000 # номер запроса, на котором деградация полностью заканчивается
  health_factor:
    5.0 # во сколько раз замедляется обслуживание узла в пике деградации
    # (1.0 = норма, 5.0 = обслуживание в 5 раз медленнее обычного)
  is_down:
    false # false = узел не отключается полностью, только замедляется;
    # true = узел становится полностью недоступным (для схем полного отказа)
  ramp_queries:
    20000 # число запросов, за которое health_factor линейно нарастает от 1.0
    # до целевого значения в начале окна и линейно спадает в конце
    # (без этого деградация была бы мгновенным "скачком", а не постепенной)
  extra: # ДОПОЛНИТЕЛЬНЫЕ (независимые) события деградации — можно задать
    # несколько одновременных или последовательных деградаций разных узлов
    - engine: row # второе событие деградации — на строчном (ROW) кластере
      node_idx: 1 # конкретно узел row_1
      start_query: 135000 # начинается ближе к концу эпизода
      end_query: 150000 # заканчивается на последнем запросе эпизода
      health_factor: 4.0 # замедление в 4 раза в пике
      is_down: false # без полного отключения узла
      ramp_queries: 7500 # постепенное нарастание/спад за 7500 запросов

dqn: # --- Гиперпараметры RL-агента (DQN), см. src/dqn_agent.py ---
  gamma: 0.9 # коэффициент дисконтирования будущей награды (0 = жадный агент, 1 = "дальнозоркий")
  lr: 0.001 # скорость обучения (learning rate) оптимизатора Adam для Q-сети
  eps_base: 0.03 # минимальная (базовая) интенсивность случайной разведки после затухания
  eps_start: 0.6 # начальная (максимальная) интенсивность разведки в начале онлайн-фазы
  eps_decay_steps: 50000 # число онлайн-шагов, за которое эпсилон линейно падает eps_start -> eps_base
  eps_drift:
    0.15 # величина, до которой временно повышается эпсилон при обнаружении дрейфа
    # нагрузки/аномалии (срабатывает только когда базовое значение уже на минимуме)
  target_sync_every: 100 # период (в онлайн-шагах) синхронизации target-сети с основной Q-сетью
  pretrain_enabled:
    0 # 1 = перед эпизодом агент проходит офлайн-претрейн на оракульном логе
    # (тёплый старт); 0 = агент стартует со случайных весов Q-сети
  pretrain_grad_steps: 20 # число градиентных шагов офлайн-претрейна (если pretrain_enabled=1)
  buffer_size: 20000 # ёмкость replay-буфера (число хранимых переходов s,a,r,s')
  batch_size: 256 # размер батча, сэмплируемого из буфера на каждом обучающем шаге
  hidden_size: 64 # размер (число нейронов) каждого скрытого слоя Q-сети
  n_hidden_layers: 2 # число скрытых слоёв полносвязной Q-сети
  safety_enabled:
    1 # 1 = включён откат к эвристике (cost-threshold) при аномальном
    # всплеске задержки; 0 = агент действует только своей политикой
  drift_exploration_enabled:
    1 # 1 = включено повышение эпсилон (до eps_drift) при обнаружении
    # дрейфа нагрузки; 0 = эпсилон следует только плановому затуханию
  grad_steps_per_update: 10 # число градиентных шагов НА КАЖДЫЙ обучающий вызов
  train_interval:
    1 # по-умолчанию 5. обучение (вызов _train_step) запускается раз в N шагов
    # среды, а не на каждом шаге — контроль вычислительной нагрузки
  per_alpha:
    0.6 # степень приоритизации в Prioritized Experience Replay
    # (0 = равномерный сэмплинг, как в обычном replay-буфере)
  per_beta_start:
    0.4 # начальное значение коэффициента коррекции
    # importance-sampling смещения PER
  per_beta_frames: 20000 # число обучающих шагов, за которое beta растёт до 1.0
  per_eps:
    0.001 # малая константа, исключающая нулевой приоритет
    # перехода в PER (чтобы каждый переход имел шанс быть выбранным)
  tail_shield_enabled: 1 # 1 = включён защитный щит для хвоста стоимости analytic-запросов
  # tail_shield_cost_threshold и tail_shield_qtypes оставлены на значениях
  # по умолчанию из DQNRouter.__init__ (не переопределяются здесь)

bandit: # --- Параметры контекстуального бандита LinTS (см. src/bandit.py) ---
  alpha: 1.0 # начальная дисперсия априорного распределения весов бандита

sla_ms:
  200 # порог SLA (мс) для описательных метрик (pct_under_sla, доля "успешных"
  # запросов) — НЕ входит в reward и не влияет на обучение, только диагностика.
  # ПРИМЕЧАНИЕ (п.3 анализа after-калибровки): значение рассчитано под
  # исходный масштаб задержки; после правок cost_scaling_reference /
  # network_cost_scaling_exponent в environment.py медианный масштаб
  # задержки должен вернуться к этому же порядку величины.

n_runs: 5 # число независимых прогонов эксперимента (для статистической значимости)
seed0: 1000 # базовое зерно генератора случайных чисел; seed конкретного прогона = seed0 + run_id

reward: # --- Веса компонентов функции награды RL-агента (см. environment.py::step) ---
  imbalance_weight: 1.0 # вес штрафа за дисбаланс средней загрузки очередей между кластерами ROW/COL
  congestion_weight: 0.6 # вес штрафа за глубину очереди ВЫБРАННОГО узла (немедленный сигнал перегрузки)
  sla_violation_weight: 0.5 # вес бинарного штрафа за превышение адаптивного порога задержки
  failover_weight: 1.0 # вес штрафа за срабатывание failover (перенаправление на другой движок)

plots: # --- Настройки визуализации результатов (см. experiments/make_plots.py) ---
  subsets: # именованные подмножества стратегий для отдельных наборов графиков —
    # удобно, если некоторые методы сильно выбиваются по масштабу и "сжимают"
    # остальные кривые на общем графике
    all: # набор "все стратегии" — файлы графиков без суффикса в имени
      - round_robin
      - hash
      - cost_threshold
      - gbm_static
      - bandit_lints
      - rl_dqn
